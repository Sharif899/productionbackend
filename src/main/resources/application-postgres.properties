# PostgreSQL profile — activate with --spring.profiles.active=postgres
# (or SPRING_PROFILES_ACTIVE=postgres).
#
# The connection comes entirely from environment variables; there is no
# host, username or password in this file. If SPRING_DATASOURCE_URL is
# not set the service fails fast at startup instead of silently
# falling back to the in-memory database.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Explicit dialect — Spring Boot would also auto-detect it from the driver.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway owns the schema here too; Hibernate validates the mapping.
spring.jpa.hibernate.ddl-auto=validate

# Hikari connection pool: small on purpose. 20 connections covers
# the create pattern (the order transaction plus the REQUIRES_NEW
# idempotency store hold two at once), and a free-tier database
# limits connections, so it stays small.
spring.datasource.hikari.pool-name=prod-pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.h2.console.enabled=false
