spring.application.name=production-backend
server.port=8080

# Default profile: in-memory H2. The service runs anywhere with no
# external database and no setup. Every datasource setting below is
# environment-driven; the H2 values are only fallbacks when no
# variables are set. No secret is ever stored in this file.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:proddb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.pool-name=prod-pool
# 20 connections, not 10: a create holds two at once (the order
# transaction plus the REQUIRES_NEW idempotency store), so 10
# workers creating orders would otherwise queue for a connection.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Flyway owns the schema; Hibernate only validates that the entity
# mapping matches the migrated tables.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=false

# JSON: ISO-8601 dates, not numeric timestamps.
spring.jackson.serialization.write-dates-as-timestamps=false

# Actuator: health, info and metrics only.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.build.enabled=true
# Redis is an optional cache, not a dependency: its absence must not
# mark the service unhealthy. The db indicator still fails health
# when the database is down.
management.health.redis.enabled=false

# Rate limiting: token bucket per API key (or client address when no
# key is sent). 100 requests per minute per key by default.
app.rate-limit.enabled=true
app.rate-limit.requests-per-minute=100

# Read cache: "memory" (default, in-process) or "redis". Redis is only
# used when app.cache.type=redis; the app starts and works correctly
# with no Redis available.
app.cache.type=${CACHE_TYPE:memory}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000

# Logging: one line per request (method, path, status, ms, request id).
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n
logging.level.com.sharif899.prodbackend=INFO
logging.level.org.springframework.web=WARN
